<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play Icon</title>
<style>
  /* Google Play hi-res icon: 512x512, full-bleed square (Play rounds the corners itself).
     Same artwork as app/src/main/res/drawable/ic_launcher_foreground.xml, cropped to its safe zone. */
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #1D2A3A; }
  svg { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
  <svg viewBox="22 22 64 64" fill="none" stroke-linecap="round">
    <path d="M46,30 L46,78 M62,30 L62,78 M30,46 L78,46 M30,62 L78,62" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5"/>
    <path d="M32,32 L44,44 M44,32 L32,44" stroke="#F25F4C" stroke-width="4"/>
    <circle cx="54" cy="54" r="6" stroke="#2EC4B6" stroke-width="4"/>

</body>
</html>
